services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      retries: 30

  consumer:
    cpu_shares: 4096
    build: ./consumer
    restart: on-failure
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./auth:/app/auth:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      db:
        condition: service_healthy

  api:
    cpu_shares: 512
    build: ./api
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      WEB_CONCURRENCY: "4"
      API_POOL_SIZE: ${API_POOL_SIZE:-5}
      DB_REQUEST_TIMEOUT: ${DB_REQUEST_TIMEOUT:-1}
    ports:
      - "3003:3003"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
