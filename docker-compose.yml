services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: temperature
    volumes:
      - postgres_data:/var/lib/postgresql/data

  consumer:
    build: ./consumer
    restart: on-failure
    environment:
      DB_HOST: db
      KAFKA_TOPIC: group12
      KAFKA_BROKER: <ip>:<port>
      NOTIFICATIONS_URL: http://notifications-service:3000/api/notify
    depends_on:
      - db

  api:
    build: ./api
    restart: on-failure
    environment:
      DB_HOST: db
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data:
